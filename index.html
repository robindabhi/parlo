<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E8F86"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Parlo">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Parlo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one phone-width column, winding lesson path, fixed bottom tab bar; full-screen lesson mode */
:root{
  --bg:#EEF4F3; --surface:#FFFFFF; --sunk:#E3ECEA; --ink:#17302D; --muted:#5F7572; --line:#D3DFDC;
  --brand:#0E8F86; --brand-d:#0A6A63; --brand-soft:#D4EFEC;
  --sun:#F5A524; --sun-d:#C77F0C; --sun-soft:#FDEFD3; --sun-ink:#7A4A00;
  --good:#22A06B; --good-soft:#DDF4E8; --bad:#E5484D; --bad-d:#B8363A; --bad-soft:#FDE2E3;
  --heart:#E5484D; --gem:#3A8DDE; --lock:#B9C6C3; --lock-d:#9AA9A6;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A19; --surface:#162523; --sunk:#1D302D; --ink:#E6F1EF; --muted:#94AAA6; --line:#29403C;
  --brand:#25B8AC; --brand-d:#14857C; --brand-soft:#173D39;
  --sun:#F7B23B; --sun-d:#B97B12; --sun-soft:#3A2E14; --sun-ink:#F7B23B;
  --good:#3CC48A; --good-soft:#163828; --bad:#F2666A; --bad-d:#B8363A; --bad-soft:#3D1D1F;
  --heart:#F2666A; --gem:#5AA6F0; --lock:#3A4E4A; --lock-d:#2B3B38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A19; --surface:#162523; --sunk:#1D302D; --ink:#E6F1EF; --muted:#94AAA6; --line:#29403C;
  --brand:#25B8AC; --brand-d:#14857C; --brand-soft:#173D39;
  --sun:#F7B23B; --sun-d:#B97B12; --sun-soft:#3A2E14; --sun-ink:#F7B23B;
  --good:#3CC48A; --good-soft:#163828; --bad:#F2666A; --bad-d:#B8363A; --bad-soft:#3D1D1F;
  --heart:#F2666A; --gem:#5AA6F0; --lock:#3A4E4A; --lock-d:#2B3B38; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
#app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;
  font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.02em;text-transform:uppercase;
  background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d);transition:transform .06s,box-shadow .06s,filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--brand);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#3B2600;box-shadow:0 4px 0 var(--sun-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default;transform:none}
.link{color:var(--brand);font-weight:800;text-transform:uppercase;font-size:.9rem;letter-spacing:.04em;padding:10px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding-block:12px;border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.stat{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:1.05rem;padding:6px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.stat:hover{background:var(--sunk)}
.stat.fire{color:var(--sun)} .stat.fire.cold{color:var(--muted)}
.stat.gem{color:var(--gem)} .stat.heart{color:var(--heart)}
.flagbtn{font-size:1.6rem;padding:4px 6px;border-radius:10px}
.flagbtn:hover{background:var(--sunk)}

main{flex:1;padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}

/* daily goal card */
.goal{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center}
.bar{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--sun);transition:width .5s}
.bar.brand>i{background:var(--brand)}

/* unit banner + path */
.unit{border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit h2{font-size:1.35rem}
.unit p{margin:2px 0 0;opacity:.92;font-weight:700;font-size:.95rem}
.unit .big{font-size:2.2rem;margin-left:auto}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:18px 8px}
.node{position:relative;flex:none;width:74px;height:70px;border-radius:50%;font-size:1.9rem;display:grid;place-items:center;
  background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:#fff;transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--lock-d)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.node.open{background:var(--brand);box-shadow:0 7px 0 var(--brand-d)}
.node.open::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--brand);opacity:.35;animation:pulse 1.8s infinite}
.node .tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--brand);border:2px solid var(--line);
  font-family:var(--display);font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.5}100%{transform:scale(1.25);opacity:0}}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav>div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 2px 10px;font-weight:800;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.nav button span{font-size:1.5rem;line-height:1.3;filter:grayscale(.6);opacity:.8}
.nav button.on{color:var(--brand)} .nav button.on span{filter:none;opacity:1}

/* cards and lists */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{font-family:var(--display);font-weight:800;font-size:1.4rem}
.tile{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;
  text-align:left;width:100%;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile .ic{font-size:2.1rem;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--sunk);flex:none}
.tile h3{font-size:1.15rem}
.tile p{margin:0;color:var(--muted);font-size:.92rem}
.list{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;background:var(--sunk);font-weight:800;font-size:.8rem;color:var(--muted)}
.chip.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statbox{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.statbox b{font-family:var(--display);font-size:1.35rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.statbox small{color:var(--muted);font-weight:700}
.statbox .e{font-size:1.6rem}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.78rem;font-weight:800;color:var(--muted)}
.badge span{font-size:1.8rem;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:var(--sunk);filter:grayscale(1);opacity:.5}
.badge.got{color:var(--ink)} .badge.got span{background:var(--sun-soft);filter:none;opacity:1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px}
.word-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.word-row:last-child{border-bottom:0}
.strength{display:flex;gap:3px}
.strength i{width:8px;height:16px;border-radius:3px;background:var(--sunk)}
.strength i.on{background:var(--brand)}
input.field{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--sunk);color:var(--ink)}
input.field:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.pick button{font-size:1.9rem;height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line)}
.pick button.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 0 var(--brand)}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:800;text-align:left}
.langs button span{font-size:1.8rem}
.langs button.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 3px 0 var(--brand)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);font-weight:800;background:var(--surface)}
.seg button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.lb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px}
.lb.me{background:var(--brand-soft)}
.lb .rank{font-family:var(--display);font-weight:800;width:24px;text-align:center;color:var(--muted)}
.lb .av{font-size:1.8rem;width:46px;height:46px;border-radius:50%;background:var(--sunk);display:grid;place-items:center}
.lb b{font-variant-numeric:tabular-nums}
textarea.field{width:100%;min-height:90px;font:inherit;font-size:.8rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--sunk);color:var(--ink);word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;font-weight:800;z-index:50;max-width:calc(100% - 32px);text-align:center;animation:pop .25s}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}

/* welcome */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:28px 6px}
.hero h1{font-size:2.6rem;color:var(--brand)}
.hero p{margin:0;max-width:34ch;font-weight:700;color:var(--muted)}
.mascot{width:120px;height:120px}
.mascot.sm{width:72px;height:72px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800}

/* lesson */
.lesson{flex:1;min-height:100%;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;padding-block:14px}
.lhead .x{font-size:1.6rem;color:var(--muted);width:40px;height:40px;border-radius:10px}
.lhead .bar{height:16px}
.lhead .bar>i{background:var(--brand)}
.lbody{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
.prompt{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.2}
.say{display:flex;align-items:center;gap:12px}
.spk{flex:none;width:52px;height:52px;border-radius:14px;background:var(--gem);color:#fff;font-size:1.5rem;box-shadow:0 4px 0 #2765A3;display:grid;place-items:center}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #2765A3}
.spk.big{width:110px;height:96px;font-size:3rem;border-radius:20px}
.spk.slow{width:64px;height:64px;font-size:1.6rem;background:var(--brand-soft);color:var(--brand);box-shadow:0 4px 0 var(--line)}
.target{font-size:1.5rem;font-weight:800;border-bottom:2px dashed var(--line);padding-bottom:2px}
.opts{display:grid;gap:12px}
.opts.pics{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);
  box-shadow:0 4px 0 var(--line);font-weight:800;font-size:1.1rem;text-align:left;min-height:58px}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.opt.pic{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:16px 8px}
.opt.pic .em{font-size:3rem;line-height:1}
.opt.on{border-color:var(--gem);background:color-mix(in srgb,var(--gem) 14%,var(--surface));box-shadow:0 4px 0 var(--gem);color:var(--gem)}
.opt.ok{border-color:var(--good);background:var(--good-soft);box-shadow:0 4px 0 var(--good);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad);color:var(--bad)}
.opt.gone{opacity:.25;pointer-events:none;box-shadow:none}
.opt:disabled{cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.match .opt{justify-content:center;text-align:center}
.answer{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-block:6px;background-image:linear-gradient(var(--line),var(--line));background-size:100% 2px;background-position:0 60px;background-repeat:no-repeat}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:12px}
.tok{padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:800;font-size:1.05rem}
.tok.used{background:var(--sunk);color:transparent;box-shadow:none;pointer-events:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.05rem}
.newword{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.newword .em{font-size:5rem;line-height:1.1}
.newword .w{font-family:var(--display);font-size:2.4rem;font-weight:800;color:var(--brand)}
.mic{width:100%;min-height:72px;border-radius:16px;font-weight:800;font-size:1.1rem;color:var(--gem);border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:10px}
.mic.live{color:#fff;background:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 var(--bad-d);animation:breathe 1s infinite}
@keyframes breathe{50%{filter:brightness(1.15)}}
.foot{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot.good{background:var(--good-soft);border-color:transparent}
.foot.bad{background:var(--bad-soft);border-color:transparent}
.foot .fb{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.foot .fb .ico{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--surface)}
.foot.good h3{color:var(--good)} .foot.bad h3{color:var(--bad)}
.foot .fb p{margin:2px 0 0;font-weight:700}
.foot.good .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000)}
.foot.bad .btn{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.foot .row2{display:flex;gap:12px;align-items:center}
.combo{font-family:var(--display);font-weight:800;color:var(--sun);font-size:1.05rem;text-align:center;animation:pop .3s}

/* results */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:30px}
.result h1{font-size:2.2rem;color:var(--sun)}
.rboxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rbox{border-radius:14px;border:2px solid var(--c);overflow:hidden}
.rbox small{display:block;background:var(--c);color:#fff;font-weight:800;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;padding:4px}
.rbox b{display:block;font-family:var(--display);font-size:1.5rem;padding:8px 4px;color:var(--c)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}

/* games */
.flash{perspective:900px;height:260px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:2px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 0 var(--line);padding:16px;text-align:center}
.flash .back{transform:rotateY(180deg)}
.flash .em{font-size:4rem;line-height:1}
.flash .w{font-family:var(--display);font-size:2.2rem;font-weight:800;color:var(--brand)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem button{aspect-ratio:1/1;max-width:100%;border-radius:14px;font-weight:800;font-size:1.05rem;padding:6px;border:2px solid var(--line);
  background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d);word-break:break-word}
.mem button.up{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.mem button.up .em{font-size:2.4rem}
.mem button.got{background:var(--good-soft);color:var(--good);border-color:var(--good);box-shadow:none}
.timer{font-family:var(--display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.modal{align-items:center}.modal>div{border-radius:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div id="app"></div>

<script>
(()=>{
/* ---------------- Course content ---------------- */

const KEY='parlo.v1';

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const weekKey=()=>{const d=new Date();const m=(d.getDay()+6)%7;d.setDate(d.getDate()-m);return dayKey(d)};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[¿?¡!.,;:"«»]/g,' ').replace(/\s+/g,' ').trim();
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/œ/g,'oe');
const tokens=s=>s.replace(/[¿?¡!.,;:«»]/g,' ').split(/\s+/).filter(Boolean);

/* daily upkeep: hearts refill, streak decay, new day/week */
function upkeep(p){
  if(!p)return;
  const now=Date.now(),step=30*60e3;
  if(p.hearts<5){const n=Math.floor((now-p.heartAt)/step);if(n>0){p.hearts=Math.min(5,p.hearts+n);p.heartAt+=n*step}}
  if(p.hearts>=5)p.heartAt=now;
  const t=dayKey();
  if(p.today.d!==t)p.today={d:t,xp:0};
  if(p.week.k!==weekKey())p.week={k:weekKey(),xp:0};
  if(p.lastDay&&p.streak>0){

const JOKE_VOICE=/^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i;
function voiceScore(v,tts){
  const lang=(v.lang||'').replace('_','-').toLowerCase(),want=tts.toLowerCase(),n=(v.name||'')+' '+(v.voiceURI||'');
  if(lang.slice(0,2)!==want.slice(0,2)||JOKE_VOICE.test(n))return -1;
  let s=lang===want?30:10;
  if(/premium/i.test(n))s+=70;
  if(/natural|neural|enhanced|wavenet|online/i.test(n))s+=50;
  if(/google/i.test(n))s+=40;
  if(/siri/i.test(n))s+=35;
  if(/samantha|daniel|karen|moira|tessa|rishi|serena|aaron|nicky|martha|arthur|thomas|amelie|anna|alice|monica|paulina|jorge|marie|helena|federica|luca/i.test(n))s+=20;

function distract(lang,correct,field,n){return pick(allWords(lang).filter(w=>w[field]!==correct[field]&&w.en!==correct.en),n)}
function buildLesson(u,n,mode){

  const canListen=hasTTS&&!p.listenOff,canSpeak=SR&&!speakBroken&&!p.speakOff&&!LANGS[lang].noSpeak;
  let words,phr=[];
  if(mode==='practice'){
    const learned=allWords(lang).filter(w=>c.srs[w.key]);
    const pool=learned.length>=4?learned:allWords(lang).slice(0,6);
    words=shuffle(pool).sort((a,b)=>((c.srs[a.key]||{}).box||0)-((c.srs[b.key]||{}).box||0)).slice(0,5);
    const done=UNITS.map((U,i)=>i).filter(i=>c.done[i+'-'+(LESSONS_PER_UNIT-1)]);
    phr=done.length?pick(done.flatMap(i=>phrasesOf(lang,i)),2):[];
  }else if(n<LESSONS_PER_UNIT-1){words=UNITS[u].words.slice(n*3,n*3+3).map((_,i)=>W(lang,u,n*3+i))}
  else{words=UNITS[u].words.map((_,i)=>W(lang,u,i));phr=phrasesOf(lang,u)}
  const fresh=words.filter(w=>!c.srs[w.key]);
  if(mode!=='practice'&&n<LESSONS_PER_UNIT-1)fresh.forEach(w=>{q.push({t:'intro',w});q.push({t:'pick',w})});
  const wordTypes=['toEng','toTarget','pick','type'];if(canListen)wordTypes.push('listen','listen');
  const ws=n===LESSONS_PER_UNIT-1&&mode!=='practice'?pick(words,4):words;
  ws.forEach((w,i)=>{q.push({t:wordTypes[(i+Math.floor(Math.random()*9))%wordTypes.length],w})});
  const mpool=mode==='practice'||n===LESSONS_PER_UNIT-1?words:[...words,...allWords(lang).filter(w=>c.srs[w.key]&&!words.some(x=>x.key===w.key))];
  q.push({t:'match',ws:[...words.slice(0,3),...pick(mpool.filter(w=>!words.slice(0,3).includes(w)),2)]});
  if(n<LESSONS_PER_UNIT-1&&mode!=='practice')words.forEach(w=>q.push({t:pick(['toEng','toTarget','type',...(canListen?['listen']:[])],1)[0],w}));
  phr.forEach((ph,i)=>{
    const opts=['build','buildRev'];if(canListen)opts.push('hearBuild');
    q.push({t:opts[i%opts.length],ph});

  });
  if(mode==='practice'||n===LESSONS_PER_UNIT-1){const head=q.filter(x=>x.t==='intro'||x.t==='pick');return [...head,...shuffle(q.filter(x=>!head.includes(x)))].slice(0,14)}
  return q;
}

     <div class="bank">${ex.bank.map((b,bi)=>`<button class="tok ${ex.picked.includes(bi)?'used':''}" data-a="tpick" data-v="${bi}" ${L.answered?'disabled':''}>${esc(b.t)}</button>`).join('')}</div>`;
  }else if(ex.t==='speak'){

  app.innerHTML=`<div class="lesson"><div class="lhead"><button class="x" data-a="quit" aria-label="Quit lesson">✕</button><div class="bar"><i style="width:${prog}%"></i></div>
    <span class="stat heart">${p.unlimited?'❤️ ∞':'❤️ '+p.hearts}</span></div>
    <div class="lbody">${comboLine}${body}</div>${footer(ex)}</div>`;
  const ti=$('#typed');if(ti){ti.addEventListener('input',e=>{L.sel=e.target.value;const g=$('#go');g&&(g.disabled=!L.sel.trim())});if(!L.answered)ti.focus()}
  if(!L.spoke&&hasTTS&&!L.answered&&['intro','listen','hearBuild','pick'].includes(ex.t)){L.spoke=1;setTimeout(()=>say(ex.w?ex.w.t:ex.ph.tg),250)}
}
function optCls(v,correct){

function footer(ex){

A.hear=(v,el)=>say(v,!!el.dataset.slow);
A.opt=v=>{if(L.answered)return;L.sel=v;const ex=cur();if(ex.t==='pick'){const w=ex.opts.find(o=>o.en===v);w&&say(w.t)}
  if(ex.t==='toTarget'||ex.t==='listen')say(v);renderLesson()};

function tryMatch(){
  const ex=cur();
  if(ex.selL&&ex.selR){
    if(ex.selL===ex.selR){ex.got.push(ex.selL);beep(true);ex.selL=ex.selR=null;
      if(ex.got.length===ex.ws.length){L.answered=true;L.right++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);L.res={ok:true,note:'All pairs matched.'};ex.ws.forEach(w=>srsBump(w,true))}}
    else{beep(false);const a=ex.selL,b=ex.selR;ex.selL=ex.selR=null;renderLesson();
      document.querySelectorAll(`[data-a="mL"][data-v="${a}"],[data-a="mR"][data-v="${b}"]`).forEach(el=>el.classList.add('no'));return}
  }

}
A.check=()=>{
  const p=P(),ex=cur();let ok=false,correct='',note='';
  if(ex.t==='pick'){ok=L.sel===ex.w.en;correct=ex.w.en}
  else if(ex.t==='toEng'){ok=L.sel===ex.w.en;correct=ex.w.en}
  else if(ex.t==='toTarget'||ex.t==='listen'){ok=L.sel===ex.w.t;correct=ex.w.t}
  else if(ex.t==='type'){const a=norm(L.sel||''),b=norm(ex.w.t);correct=ex.w.t;
    if(a===b)ok=true;else if(noAcc(a)===noAcc(b)){ok=true;note=`Watch the accents: <b>${esc(ex.w.t)}</b>`}
    else if(lev(noAcc(a),noAcc(b))===1&&b.length>4){ok=true;note=`Small typo. It's spelled <b>${esc(ex.w.t)}</b>`}}
  else if(ex.bank){const ans=ex.t==='buildRev'?ex.ph.en:ex.ph.tg;correct=ans;
    const got=ex.picked.map(i=>ex.bank[i].t).join(' ');ok=noAcc(norm(got))===noAcc(norm(ans))}
  grade(ok,correct,note);
};
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function grade(ok,correct,note){

  else{L.wrong++;L.combo=0;if(!p.unlimited&&L.mode!=='practice'){p.hearts=Math.max(0,p.hearts-1);if(p.hearts<5&&p.hearts===4)p.heartAt=Date.now()}
    if(!ex.retry){const c={...ex,retry:true};delete c.opts;delete c.bank;delete c.picked;L.q.push(c)}save()}
  if(ex.w)srsBump(ex.w,ok);
  if(ok&&ex.t!=='intro'){const say2=ex.ph?ex.ph.tg:null;say2&&setTimeout(()=>say(say2),150)}
  renderLesson();
}
function srsBump(w,ok){const c=course();const s=c.srs[w.key]||(c.srs[w.key]={box:0,due:0});
  s.box=ok?Math.min(6,s.box+1):Math.max(1,s.box-1);s.due=Date.now()+[0,1,2,4,7,15,30][s.box]*864e5;}
A.next=()=>{

    const tw=noAcc(norm(target)).split(' ');let best=0;

function confetti(){

  const W=c.width=innerWidth,H=c.height=innerHeight;const cols=['#F5A524','#0E8F86','#3A8DDE','#E5484D','#8E5BD1'];
  const ps=Array.from({length:120},()=>({x:W/2,y:H/3,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,r:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});

    app.innerHTML=`<div class="lesson">${gameHead('⚡ Speed Round',`<span class="timer" id="tm">${left}s</span>`)}
     <div class="lbody"><div class="row" style="justify-content:space-between"><span class="chip sun">Score ${G.score}</span><span class="muted" style="font-weight:700">Wrong answers cost 3 seconds</span></div>
     <div class="newword"><div class="em">${G.q.dir?'':G.q.w.em}</div><div class="w">${esc(G.q.dir?G.q.w.t:G.q.w.en)}</div></div>
     <div class="opts">${G.q.opts.map((o,i)=>`<button class="opt" data-a="spd" data-v="${esc(o.key)}"><span class="k">${i+1}</span>${esc(o[f])}</button>`).join('')}</div></div></div>`;
    timers.push(setInterval(()=>{const s=Math.max(0,Math.ceil((G.end-Date.now())/1000));const t=$('#tm');if(t)t.textContent=s+'s';if(s<=0)renderGame()},250));
  }else if(G.k==='memory'){
    app.innerHTML=`<div class="lesson">${gameHead('🧩 Memory Match',`<span class="chip">${G.moves} moves</span>`)}
     <div class="lbody"><p class="muted" style="margin:0;font-weight:700">Find each picture and its ${LANGS[p.lang].name} word.</p>
     <div class="mem">${G.cards.map((c,i)=>{const up=G.up.includes(i)||G.got.includes(i);return `<button class="${up?'up':''} ${G.got.includes(i)?'got':''}" data-a="flipm" data-v="${i}" aria-label="card ${i+1}">${up?c.face:'?'}</button>`}).join('')}</div></div></div>`;
  }else if(G.k==='ears'){
    if(G.round>=10){return gameOver('Great listening!',`${G.score} out of 10`,G.score,'ears',G.score,(a,b)=>a>b)}
    if(!G.q){const w=pick(G.pool,1)[0];G.q={w,opts:shuffle([w,...pick(G.pool.filter(x=>x.key!==w.key&&x.em!==w.em),5)])};setTimeout(()=>say(w.t),300)}
    app.innerHTML=`<div class="lesson">${gameHead('👂 Sharp Ears',`<span class="chip">${G.round+1} / 10</span>`)}
     <div class="lbody"><div class="row" style="justify-content:center;gap:16px"><button class="spk big" data-a="hear" data-v="${esc(G.q.w.t)}" aria-label="Play">🔊</button><button class="spk slow" data-a="hear" data-v="${esc(G.q.w.t)}" data-slow="1" aria-label="Play slowly">🐢</button></div>
     <div class="opts pics" style="grid-template-columns:repeat(3,1fr)">${G.q.opts.map(o=>`<button class="opt pic" data-a="ear" data-v="${o.key}"><span class="em">${o.em}</span></button>`).join('')}</div>
     <div class="chip sun" style="align-self:center">Score ${G.score}</div></div></div>`;
  }else if(G.k==='flash'){
    if(G.i>=G.ws.length){return gameOver('Deck reviewed!',`You knew ${G.known} of ${G.ws.length}`,Math.min(10,G.ws.length),null)}
    const w=G.ws[G.i];
    app.innerHTML=`<div class="lesson">${gameHead('🃏 Flashcards',`<span class="chip">${G.i+1} / ${G.ws.length}</span>`)}
     <div class="lbody"><button class="flash ${G.flip?'flip':''}" data-a="flip" aria-label="Flip card" style="padding:0;width:100%"><div class="in">
      <div class="face"><div class="w">${esc(w.t)}</div><div class="muted" style="font-weight:800">Tap to see the meaning</div></div>
      <div class="face back"><div class="em">${w.em}</div><div class="w" style="color:var(--ink)">${esc(w.en)}</div><div class="muted" style="font-weight:800">${esc(w.t)}</div></div></div></button>
     ${G.flip?`<div class="row" style="gap:10px"><button class="btn bad grow" data-a="rate" data-v="0">Again</button><button class="btn grow" data-a="rate" data-v="1">Good</button><button class="btn sun grow" data-a="rate" data-v="2">Easy</button></div>`
      :`<button class="btn ghost block" data-a="hear" data-v="${esc(w.t)}" ${hasTTS?'':'disabled'}>🔊 Hear it</button>`}</div></div>`;
    if(!G.flip&&!G.spoke){G.spoke=1;setTimeout(()=>say(w.t),250)}
  }
}
A.spd=v=>{const ok=v===G.q.w.key;beep(ok);if(ok){G.score++;say(G.q.w.t)}else G.end-=3000;G.q=null;renderGame()};
A.ear=(v,el)=>{const ok=v===G.q.w.key;beep(ok);if(ok)G.score++;el.classList.add(ok?'ok':'no');
  if(!ok)document.querySelector(`[data-a="ear"][data-v="${G.q.w.key}"]`).classList.add('ok');
  document.querySelectorAll('[data-a="ear"]').forEach(b=>b.disabled=true);setTimeout(()=>{G.round++;G.q=null;renderGame()},ok?600:1300)};
A.flipm=v=>{
  const i=+v;if(G.busy||G.up.includes(i)||G.got.includes(i))return;
  G.up.push(i);const c=G.cards[i];if(c.w)say(c.w.t);
  if(G.up.length===2){G.moves++;const [a,b]=G.up;
    if(G.cards[a].key===G.cards[b].key){G.got.push(a,b);G.up=[];beep(true);
      if(G.got.length===G.cards.length){renderGame();setTimeout(()=>gameOver('All matched!',`Finished in ${G.moves} moves`,10,'memory',G.moves,(a,b)=>a<b),500);return}}
    else{G.busy=true;renderGame();setTimeout(()=>{G.up=[];G.busy=false;renderGame()},900);return}}
  renderGame();
};
A.flip=()=>{G.flip=!G.flip;renderGame()};
A.rate=v=>{const w=G.ws[G.i],c=course(),s=c.srs[w.key]||(c.srs[w.key]={box:0,due:0});
  if(v==='0'){s.box=1;s.due=Date.now()+10*60e3;G.ws.push(w)}else{s.box=Math.min(6,s.box+(+v));s.due=Date.now()+[0,1,2,4,7,15,30][s.box]*864e5;G.known++}
  save();G.i++;G.flip=false;G.spoke=0;renderGame()};

/* ---------------- Family ---------------- */
function renderFamily(){
  const p=P();
  const wk=weekKey();
  const rows=S.profiles.map(x=>({x,xp:x.week.k===wk?x.week.xp:0})).sort((a,b)=>b.xp-a.xp);
  return `<h1 class="sec-h">Family league</h1>
   <p class="muted" style="margin:0;font-weight:700">This week's XP for everyone learning on this device. Resets every Monday.</p>
   <div class="card" style="padding:8px">${rows.map((r,i)=>`<div class="lb ${r.x.id===p.id?'me':''}"><span class="rank">${['🥇','🥈','🥉'][i]||i+1}</span><span class="av">${r.x.avatar}</span>
     <div class="grow"><b>${esc(r.x.name)}</b><div class="muted" style="font-size:.85rem;font-weight:700">${LANGS[r.x.lang].flag} ${courseLabel(r.x.lang)} · 🔥 ${r.x.streak}</div></div><b>${r.xp} XP</b></div>`).join('')}</div>
   <div class="sec-h" style="font-size:1.15rem">Who's learning?</div>
   <div class="list">${S.profiles.map(x=>`<button class="tile" data-a="switch" data-v="${x.id}"><span class="ic">${x.avatar}</span><div class="grow"><h3>${esc(x.name)}</h3><p>${LANGS[x.lang].flag} ${courseLabel(x.lang)} · Level ${level(x.xp)}</p></div>${x.id===p.id?'<span class="chip brand">Active</span>':''}</button>`).join('')}
    <button class="btn ghost block" data-a="addp">+ Add a family member</button></div>`;
}
A.switch=v=>{S.cur=v;save();view={tab:'learn'};render();toast(`Hi ${P().name}! ${P().avatar}`)};
A.addp=()=>{draft={name:'',avatar:AVATARS[S.profiles.length%AVATARS.length],lang:'es'};view={tab:'welcome'};render()};

/* ---------------- Me / settings / shop ---------------- */
function renderMe(){
  const p=P(),lv=level(p.xp),lo=levelFloor(lv),hi=levelFloor(lv+1);
  return `<div class="row" style="gap:14px"><span style="font-size:3.4rem;width:76px;height:76px;border-radius:50%;background:var(--sunk);display:grid;place-items:center">${p.avatar}</span>
    <div class="grow"><h1 class="sec-h">${esc(p.name)}</h1><div class="muted" style="font-weight:800">Level ${lv} · ${p.xp} XP total</div>
    <div class="bar brand" style="margin-top:8px"><i style="width:${Math.round((p.xp-lo)/(hi-lo)*100)}%"></i></div><div class="muted" style="font-size:.8rem;font-weight:700;margin-top:4px">${hi-p.xp} XP to level ${lv+1}</div></div></div>
   <div class="grid2">
    <div class="statbox"><span class="e">🔥</span><div><b>${p.streak}</b><small>Day streak</small></div></div>
    <div class="statbox"><span class="e">🏅</span><div><b>${p.bestStreak}</b><small>Best streak</small></div></div>
    <div class="statbox"><span class="e">📚</span><div><b>${wordsLearned(p)}</b><small>Words learned</small></div></div>
    <div class="statbox"><span class="e">✅</span><div><b>${p.lessons}</b><small>Lessons done</small></div></div></div>
   <div class="card"><b style="font-size:1.1rem">Badges</b><div class="badges" style="margin-top:12px">${BADGES.map(b=>`<div class="badge ${p.badges.includes(b.id)?'got':''}"><span>${b.e}</span>${b.name}</div>`).join('')}</div></div>
   <div class="card list"><b style="font-size:1.1rem">Shop</b>
    <div class="row"><span style="font-size:1.8rem">❤️</span><div class="grow"><b>Refill hearts</b><div class="muted" style="font-size:.88rem;font-weight:700">Back to 5 hearts right away</div></div><button class="btn sun" data-a="buy" data-v="hearts" ${p.gems<50||p.hearts>=5||p.unlimited?'disabled':''}>50 💎</button></div>
    <div class="row"><span style="font-size:1.8rem">🧊</span><div class="grow"><b>Streak freeze</b><div class="muted" style="font-size:.88rem;font-weight:700">Protects your streak for one missed day. Own ${p.freeze}/2</div></div><button class="btn sun" data-a="buy" data-v="freeze" ${p.gems<100||p.freeze>=2?'disabled':''}>100 💎</button></div></div>
   <div class="card list"><b style="font-size:1.1rem">Settings</b>
    <div><div style="font-weight:800;margin-bottom:6px">Language</div><div class="langs">${Object.entries(LANGS).map(([k,l])=>`<button data-a="setlang" data-v="${k}" class="${p.lang===k?'on':''}"><span>${l.flag}</span><div>${l.name}<div class="muted" style="font-size:.8rem">${p.courses[k]?Object.keys(p.courses[k].done).length+' lessons done':'Not started'}</div></div></button>`).join('')}</div></div>
    <div><div style="font-weight:800;margin-bottom:6px">Daily goal</div><div class="seg">${[[10,'Casual'],[20,'Regular'],[30,'Serious'],[50,'Intense']].map(([g,n])=>`<button class="${p.goal===g?'on':''}" data-a="goal" data-v="${g}">${n} · ${g} XP</button>`).join('')}</div></div>
    ${toggle('unlimited','Unlimited hearts','Good for younger kids: mistakes never stop a lesson',p.unlimited)}
    ${voicePicker(p)}
    ${toggle('sound','Sound effects','Dings for right and wrong answers',S.sound)}
    ${toggle('listenOff','Listening exercises',hasTTS?'Play words out loud':'Not supported in this browser',!p.listenOff)}
    ${toggle('speakOff','Speaking exercises',SR?'Say sentences into the microphone':'Not supported in this browser',!p.speakOff&&!!SR)}
   </div>
   <div class="card list"><b style="font-size:1.1rem">Backup &amp; move devices</b>
    <p class="muted" style="margin:0;font-weight:700">Progress is saved in this browser only. Copy this code to keep a backup, or paste it on another phone or computer to bring everyone's progress along.</p>
    <textarea class="field" id="bk" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
    <div class="row" style="flex-wrap:wrap"><button class="btn ghost grow" data-a="copybk">Copy code</button><button class="btn ghost grow" data-a="importbk">Restore from code</button></div></div>
   <button class="link" data-a="delp" style="color:var(--bad);align-self:center">Remove ${esc(p.name)} from this device</button>`;
}
function voicePicker(p){
  if(!hasTTS)return '';
  const list=voicesFor(p.lang),cur=voiceFor(p.lang),l=LANGS[p.lang];
  const tip=/iPhone|iPad|Mac/i.test(navigator.userAgent)?(list.some(v=>/premium/i.test(v.voiceURI||v.name))?'Premium voices sound the most natural. ':'No Premium voice found yet. ')+'To add one for free: Settings → Accessibility → Spoken Content → Voices → pick the language → choose a voice marked Premium (for English, Zoe or Ava) and download it. Then close and reopen this app.'
    :/Android/i.test(navigator.userAgent)?'For a more natural voice: Settings → search "Text-to-speech" → set the engine to Speech Services by Google → Install voice data, pick the language and download a voice. It\'s free.'
    :'Voices with "Natural", "Online" or "Google" in the name usually sound best.';
  return `<div><div style="font-weight:800;margin-bottom:6px">Voice for ${esc(l.name)}</div>
   ${list.length?`<div class="row" style="flex-wrap:wrap"><select class="field grow" id="voicesel" data-a="none" style="min-width:0;font-size:1rem;padding:12px">
     ${list.map(v=>`<option value="${esc(v.voiceURI||v.name)}" ${cur&&v===cur?'selected':''}>${esc(voiceLabel(v))}</option>`).join('')}</select>
     <button class="btn ghost" data-a="testvoice">▶ Test</button></div>`
   :`<p class="muted" style="margin:0;font-weight:700">This device has no ${esc(l.name)} voice installed, so the browser's default voice is used.</p>`}
   <p class="muted" style="margin:6px 0 0;font-size:.85rem;font-weight:700">${tip}</p></div>`;
}
A.testvoice=()=>{const p=P(),w=W(p.lang,0,0),ph=PH(p.lang,0,0);say(w.t+'. '+ph.tg)};
document.addEventListener('change',e=>{if(e.target.id==='voicesel'){const p=P();p.voices=p.voices||{};p.voices[p.lang]=e.target.value;save();A.testvoice()}});
function toggle(k,label,sub,on){return `<div class="row"><div class="grow"><b>${label}</b><div class="muted" style="font-size:.88rem;font-weight:700">${sub}</div></div>
  <button class="seg-t" data-a="tog" data-v="${k}" role="switch" aria-checked="${on}" style="width:56px;height:32px;border-radius:99px;background:${on?'var(--brand)':'var(--line)'};position:relative;flex:none">
  <i style="position:absolute;top:4px;left:${on?28:4}px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s"></i></button></div>`}
A.tog=v=>{const p=P();if(v==='sound')S.sound=!S.sound;else p[v]=!p[v];if(v==='speakOff')speakBroken=false;save();render()};
A.goal=v=>{P().goal=+v;save();render()};
A.setlang=v=>{P().lang=v;save();view={tab:'learn'};render();toast(`Switched to ${LANGS[v].name} ${LANGS[v].flag}`)};
A.buy=v=>{const p=P();
  if(v==='hearts'&&p.gems>=50){p.gems-=50;p.hearts=5;p.heartAt=Date.now();toast('Hearts refilled ❤️')}
  if(v==='freeze'&&p.gems>=100&&p.freeze<2){p.gems-=100;p.freeze++;toast('Streak freeze equipped 🧊')}
  save();if(view.tab!=='lesson')render()};
A.copybk=()=>{const t=$('#bk');const done=()=>toast('Backup code copied');
  try{navigator.clipboard.writeText(t.value).then(done,()=>{t.select();toast('Select all and copy the code')})}catch(e){t.select();toast('Select all and copy the code')}};
A.importbk=()=>{modal(`<h2>Restore progress</h2><p class="muted" style="margin:0;font-weight:700">Paste a backup code. This replaces all learners on this device.</p>
  <textarea class="field" id="imp" data-keep placeholder="Paste code here"></textarea><button class="btn block" data-a="doimport" data-keep>Restore</button><button class="btn ghost block" data-a="close">Cancel</button>`)};
A.doimport=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(!d.profiles||!d.profiles.length)throw 0;
  S=d;if(!P())S.cur=S.profiles[0].id;save();closeModal();view={tab:'learn'};render();toast('Progress restored')}catch(e){toast("That code didn't work. Copy the whole code and try again.")}};
A.delp=()=>{modal(`<h2>Remove ${esc(P().name)}?</h2><p class="muted" style="margin:0;font-weight:700">Their streak, XP and words on this device will be deleted. This can't be undone.</p>
  <button class="btn bad block" data-a="dodel">Remove</button><button class="btn ghost block" data-a="close">Keep</button>`)};
A.dodel=()=>{S.profiles=S.profiles.filter(x=>x.id!==S.cur);S.cur=S.profiles[0]?S.profiles[0].id:null;save();view={tab:S.cur?'family':'welcome'};render()};


/* boot */
S=load();
if(S.cur&&!P())S.cur=S.profiles[0]?S.profiles[0].id:null;
view={tab:P()?'learn':'welcome'};
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&P()&&['learn','practice','games','family','me'].includes(view.tab))render()});
if('serviceWorker' in navigator&&location.protocol==='https:'&&/github\.io$|netlify\.app$|pages\.dev$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body></html>
